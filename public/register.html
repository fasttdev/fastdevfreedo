<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Fortech</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <div class="container nav-inner">
    <a href="/" class="brand">Fortech</a>
    <div class="nav-links"><a href="/login" class="btn btn-secondary btn-sm">Masuk</a></div>
  </div>
</nav>
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="auth-head"><h1>Buat Akun</h1><p>Gratis. Tanpa kartu kredit.</p></div>
    <div class="alert alert-error" id="err"></div>
    <form id="form">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="kamu@email.com" required>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input class="input" type="text" id="username" placeholder="fortechdev" required>
        <span class="hint">3-24 karakter, huruf kecil, angka, underscore</span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" placeholder="Minimal 6 karakter" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submit">Buat Akun</button>
    </form>
    <div class="auth-foot">Sudah punya akun? <a href="/login">Masuk</a></div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>initRegisterPage();</script>
</body>
</html>
