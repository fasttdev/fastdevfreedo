<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="Deploy situsmu ke subdomain fastdev.my.id dalam hitungan detik.">
<title>Fortech — Deploy ke subdomain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  height: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

img, svg {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

input {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

::selection {
  background: #fff;
  color: #000;
}

/* ============================================================
   TOKENS
   ============================================================ */
:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --surface-2: #111111;
  --surface-3: #161616;
  --border: #222222;
  --border-strong: #333333;
  --border-focus: #555555;
  --text: #ededed;
  --text-dim: #888888;
  --text-faint: #555555;
  --accent: #ffffff;
  --success: #00ff99;
  --danger: #ff5555;
  --warn: #ffaa00;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
}

/* ============================================================
   LAYOUT
   ============================================================ */
.container {
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 24px;
}

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   NAV
   ============================================================ */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.02em;
  color: var(--text);
}

.brand::before {
  content: '';
  width: 20px;
  height: 20px;
  background: var(--accent);
  clip-path: polygon(0 100%, 100% 0, 100% 100%);
  display: inline-block;
  flex-shrink: 0;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.nav-badge.live {
  color: var(--success);
  border-color: rgba(0, 255, 153, 0.3);
  background: rgba(0, 255, 153, 0.06);
}

.nav-badge.live::before {
  content: '●';
  display: inline-block;
  margin-right: 6px;
  font-size: 8px;
  vertical-align: middle;
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 500;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  white-space: nowrap;
  user-select: none;
}

.btn-primary {
  background: var(--accent);
  color: #000;
}

.btn-primary:hover {
  opacity: 0.88;
}

.btn-primary:active {
  transform: scale(0.98);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border-color: var(--border);
}

.btn-secondary:hover {
  background: var(--surface-3);
  border-color: var(--border-strong);
}

/* ============================================================
   HERO (LANDING)
   ============================================================ */
.hero {
  flex: 1;
  padding: 96px 0 64px;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -400px;
  left: 50%;
  transform: translateX(-50%);
  width: 900px;
  height: 900px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 55%);
  pointer-events: none;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  margin-bottom: 28px;
  letter-spacing: 0.02em;
}

.hero-eyebrow .mono {
  font-family: var(--mono);
  color: var(--text);
  font-size: 11px;
}

.hero h1 {
  font-size: clamp(36px, 6vw, 68px);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 1.02;
  margin-bottom: 24px;
}

.hero h1 .grad {
  background: linear-gradient(180deg, #ffffff 0%, #777777 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.hero-sub {
  font-size: clamp(15px, 2vw, 18px);
  color: var(--text-dim);
  max-width: 560px;
  margin-bottom: 40px;
  line-height: 1.6;
}

/* ============================================================
   LAUNCH BOX
   ============================================================ */
.launch-box {
  display: flex;
  align-items: stretch;
  max-width: 600px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.launch-box:focus-within {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);
}

.launch-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 16px 18px;
  font-size: 15px;
  font-family: var(--mono);
  min-width: 0;
}

.launch-box input::placeholder {
  color: var(--text-faint);
}

.launch-box input.shake {
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.launch-suffix {
  display: flex;
  align-items: center;
  padding: 0 14px 0 0;
  font-size: 14px;
  font-family: var(--mono);
  color: var(--text-faint);
  white-space: nowrap;
  background: transparent;
  user-select: none;
}

.launch-box .btn-primary {
  border-radius: 0;
  border-top-right-radius: var(--radius-lg);
  border-bottom-right-radius: var(--radius-lg);
  padding: 0 24px;
  font-weight: 600;
}

.launch-hint {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-faint);
}

.launch-hint a {
  color: var(--text-dim);
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--border-strong);
  transition: color 0.15s;
  font-family: var(--mono);
}

.launch-hint a:hover {
  color: var(--text);
}

/* ============================================================
   FEATURES
   ============================================================ */
.features {
  padding: 48px 0 80px;
  border-top: 1px solid var(--border);
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.feature {
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}

.feature:hover {
  border-color: var(--border-strong);
  background: var(--surface-2);
  transform: translateY(-2px);
}

.feature-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  background: var(--surface-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  margin-bottom: 14px;
}

.feature h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}

.feature p {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.55;
}

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  border-top: 1px solid var(--border);
  padding: 24px 0;
}

.footer .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--text-faint);
}

.footer .mono {
  font-family: var(--mono);
  font-size: 12px;
}

/* ============================================================
   SUBDOMAIN VIEW
   ============================================================ */
.sub-hero {
  flex: 1;
  padding: 80px 0 64px;
  display: flex;
  align-items: center;
}

.sub-hero .container {
  width: 100%;
  max-width: 720px;
}

.sub-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 500;
  color: var(--success);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid rgba(0, 255, 153, 0.3);
  background: rgba(0, 255, 153, 0.06);
  margin-bottom: 24px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.sub-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 0 rgba(0, 255, 153, 0.6);
  animation: pulse 2s ease-out infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(0, 255, 153, 0.5); }
  70% { box-shadow: 0 0 0 8px rgba(0, 255, 153, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 255, 153, 0); }
}

.sub-hero h1 {
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.1;
  margin-bottom: 16px;
  word-break: break-all;
}

.sub-hero h1 .dim {
  color: var(--text-faint);
  font-weight: 700;
}

.sub-desc {
  font-size: 15px;
  color: var(--text-dim);
  margin-bottom: 32px;
  max-width: 480px;
}

.sub-info {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  overflow: hidden;
  margin-bottom: 32px;
}

.info-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.info-row:last-child {
  border-bottom: none;
}

.info-label {
  color: var(--text-dim);
  font-size: 13px;
}

.info-value {
  color: var(--text);
  text-align: right;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.info-value.mono {
  font-family: var(--mono);
  font-size: 12.5px;
}

.info-value .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  display: inline-block;
}

/* ============================================================
   NOT FOUND / ERROR
   ============================================================ */
.error-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 24px;
  text-align: center;
}

.error-code {
  font-size: 96px;
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 1;
  margin-bottom: 12px;
  background: linear-gradient(180deg, #fff 0%, #333 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.error-msg {
  font-size: 15px;
  color: var(--text-dim);
  margin-bottom: 24px;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 640px) {
  .container {
    padding: 0 18px;
  }

  .nav-inner {
    height: 56px;
  }

  .hero {
    padding: 56px 0 40px;
  }

  .hero-eyebrow {
    margin-bottom: 20px;
  }

  .launch-box {
    flex-direction: column;
    border-radius: var(--radius-lg);
    padding: 4px;
  }

  .launch-box input {
    padding: 14px 14px 8px;
    font-size: 14px;
    text-align: center;
  }

  .launch-suffix {
    padding: 0 14px 8px;
    justify-content: center;
    font-size: 12px;
  }

  .launch-box .btn-primary {
    border-radius: var(--radius);
    padding: 12px 16px;
    width: 100%;
  }

  .features {
    padding: 32px 0 48px;
  }

  .sub-hero {
    padding: 48px 0 40px;
  }

  .info-row {
    padding: 12px 14px;
    font-size: 13px;
  }

  .footer .container {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
}

/* ============================================================
   UTIL
   ============================================================ */
.mono {
  font-family: var(--mono);
}

.small {
  font-size: 12px;
}

.hidden {
  display: none !important;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';

  /* ============================================================
     CONFIG
     ============================================================ */
  var ROOT_DOMAIN = 'fastdev.my.id';
  var MIN_SUBDOMAIN_LEN = 3;
  var MAX_SUBDOMAIN_LEN = 63;
  var SUBDOMAIN_REGEX = /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/;

  /* ============================================================
     UTILS
     ============================================================ */

  /**
   * Escape HTML entities to prevent XSS in dynamic content.
   */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c];
    });
  }

  /**
   * Detect subdomain from current hostname.
   * Returns null for apex domain, www, or unknown hosts (localhost, vercel.app, etc).
   */
  function detectSubdomain(hostname) {
    var h = String(hostname || '').toLowerCase();
    if (!h) return null;
    if (h === ROOT_DOMAIN) return null;
    if (h === 'www.' + ROOT_DOMAIN) return 'www';
    var suffix = '.' + ROOT_DOMAIN;
    if (h.length > suffix.length && h.slice(-suffix.length) === suffix) {
      var sub = h.slice(0, -suffix.length);
      // Reject multi-level subdomains like a.b.fastdev.my.id for now
      if (sub.indexOf('.') === -1) return sub;
      return sub; // allow nested for flexibility
    }
    return null;
  }

  /**
   * Sanitize user-typed subdomain: lowercase, strip illegal chars.
   */
  function sanitizeSubdomainInput(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/[^a-z0-9-]/g, '')
      .replace(/^-+/, '');
  }

  /**
   * Validate subdomain against basic rules.
   */
  function isValidSubdomain(sub) {
    if (!sub) return false;
    if (sub.length < MIN_SUBDOMAIN_LEN) return false;
    if (sub.length > MAX_SUBDOMAIN_LEN) return false;
    return SUBDOMAIN_REGEX.test(sub);
  }

  /* ============================================================
     VIEW — NAV
     ============================================================ */
  function renderNav(opts) {
    opts = opts || {};
    var isSub = !!opts.isSub;
    var homeHref = isSub ? ('https://' + ROOT_DOMAIN + '/') : '/';
    var badgeClass = isSub ? 'nav-badge live' : 'nav-badge';
    var badgeText = isSub ? 'Live' : 'Beta';
    return [
      '<nav class="nav">',
      '  <div class="container nav-inner">',
      '    <a href="' + homeHref + '" class="brand">Fortech</a>',
      '    <div class="nav-right">',
      '      <span class="' + badgeClass + '">' + badgeText + '</span>',
      '    </div>',
      '  </div>',
      '</nav>'
    ].join('');
  }

  /* ============================================================
     VIEW — LANDING
     ============================================================ */
  function renderLanding() {
    return [
      renderNav({ isSub: false }),
      '<main class="hero">',
      '  <div class="container">',
      '    <div class="hero-eyebrow">',
      '      Live on <span class="mono">' + escapeHtml(ROOT_DOMAIN) + '</span>',
      '    </div>',
      '    <h1>',
      '      <span class="grad">Deploy situsmu<br>ke subdomain dalam<br>hitungan detik.</span>',
      '    </h1>',
      '    <p class="hero-sub">Ketik subdomain yang kamu mau, langsung jadi. Tanpa kartu kredit, tanpa setup ribet.</p>',
      '    <div class="launch-box">',
      '      <input type="text" id="sub-input" placeholder="namakamu" maxlength="' + MAX_SUBDOMAIN_LEN + '" autocomplete="off" spellcheck="false" autocapitalize="none">',
      '      <span class="launch-suffix">.' + escapeHtml(ROOT_DOMAIN) + '</span>',
      '      <button type="button" id="launch-btn" class="btn btn-primary">Buka →</button>',
      '    </div>',
      '    <div class="launch-hint">',
      '      Coba: ',
      '      <a href="#" data-sub="portfolio">portfolio</a>, ',
      '      <a href="#" data-sub="blog">blog</a>, ',
      '      <a href="#" data-sub="demo">demo</a>, ',
      '      <a href="#" data-sub="hello">hello</a>',
      '    </div>',
      '  </div>',
      '</main>',
      '<section class="features">',
      '  <div class="container">',
      '    <div class="feature-grid">',
      '      <div class="feature">',
      '        <div class="feature-icon">⚡</div>',
      '        <h3>Instan</h3>',
      '        <p>Subdomain aktif dalam detik setelah DNS propagasi.</p>',
      '      </div>',
      '      <div class="feature">',
      '        <div class="feature-icon">🔒</div>',
      '        <h3>HTTPS Otomatis</h3>',
      '        <p>Setiap subdomain dapat SSL gratis dari edge network.</p>',
      '      </div>',
      '      <div class="feature">',
      '        <div class="feature-icon">🌐</div>',
      '        <h3>Wildcard</h3>',
      '        <p>Subdomain tanpa batas, tanpa konfigurasi tambahan.</p>',
      '      </div>',
      '      <div class="feature">',
      '        <div class="feature-icon">🚀</div>',
      '        <h3>Edge Network</h3>',
      '        <p>Dilayani dari edge terdekat ke pengunjung.</p>',
      '      </div>',
      '    </div>',
      '  </div>',
      '</section>',
      '<footer class="footer">',
      '  <div class="container">',
      '    <span>© ' + new Date().getFullYear() + ' Fortech</span>',
      '    <span class="mono small">' + escapeHtml(ROOT_DOMAIN) + '</span>',
      '  </div>',
      '</footer>'
    ].join('');
  }

  /* ============================================================
     VIEW — SUBDOMAIN
     ============================================================ */
  function renderSubdomainView(sub) {
    var safeSub = escapeHtml(sub);
    var fullHost = safeSub + '.' + escapeHtml(ROOT_DOMAIN);
    return [
      renderNav({ isSub: true }),
      '<main class="sub-hero">',
      '  <div class="container">',
      '    <div class="sub-badge">Live</div>',
      '    <h1>',
      '      ' + safeSub + '<span class="dim">.' + escapeHtml(ROOT_DOMAIN) + '</span>',
      '    </h1>',
      '    <p class="sub-desc">',
      '      Subdomain ini aktif dan sudah terhubung dengan benar ke jaringan edge.',
      '      Halaman default ini akan tampil untuk setiap subdomain yang belum memiliki konten.',
      '    </p>',
      '    <div class="sub-info">',
      '      <div class="info-row">',
      '        <span class="info-label">Hostname</span>',
      '        <span class="info-value mono">' + fullHost + '</span>',
      '      </div>',
      '      <div class="info-row">',
      '        <span class="info-label">Status</span>',
      '        <span class="info-value"><span class="dot"></span>Active</span>',
      '      </div>',
      '      <div class="info-row">',
      '        <span class="info-label">SSL</span>',
      '        <span class="info-value"><span class="dot"></span>Secured</span>',
      '      </div>',
      '      <div class="info-row">',
      '        <span class="info-label">Wildcard</span>',
      '        <span class="info-value mono">*.' + escapeHtml(ROOT_DOMAIN) + '</span>',
      '      </div>',
      '    </div>',
      '    <a href="https://' + escapeHtml(ROOT_DOMAIN) + '/" class="btn btn-secondary">← Kembali ke ' + escapeHtml(ROOT_DOMAIN) + '</a>',
      '  </div>',
      '</main>',
      '<footer class="footer">',
      '  <div class="container">',
      '    <span>© ' + new Date().getFullYear() + ' Fortech</span>',
      '    <span class="mono small">Subdomain Site</span>',
      '  </div>',
      '</footer>'
    ].join('');
  }

  /* ============================================================
     VIEW — INVALID SUBDOMAIN (404)
     ============================================================ */
  function renderInvalidSubdomain(sub) {
    return [
      renderNav({ isSub: false }),
      '<main class="error-wrap">',
      '  <div>',
      '    <div class="error-code">404</div>',
      '    <p class="error-msg">',
      '      Subdomain <span class="mono">' + escapeHtml(sub) + '</span> tidak valid.',
      '    </p>',
      '    <a href="https://' + escapeHtml(ROOT_DOMAIN) + '/" class="btn btn-primary">Kembali ke Beranda</a>',
      '  </div>',
      '</main>'
    ].join('');
  }

  /* ============================================================
     MOUNT — LANDING
     ============================================================ */
  function mountLanding() {
    var app = document.getElementById('app');
    app.innerHTML = renderLanding();

    var input = document.getElementById('sub-input');
    var btn = document.getElementById('launch-btn');
    if (!input || !btn) return;

    function triggerShake() {
      input.classList.add('shake');
      setTimeout(function () {
        input.classList.remove('shake');
      }, 450);
    }

    function launch() {
      var v = sanitizeSubdomainInput(input.value);
      if (!isValidSubdomain(v)) {
        triggerShake();
        input.focus();
        return;
      }
      window.location.href = window.location.protocol + '//' + v + '.' + ROOT_DOMAIN;
    }

    input.addEventListener('input', function (e) {
      var cleaned = sanitizeSubdomainInput(e.target.value);
      if (e.target.value !== cleaned) {
        e.target.value = cleaned;
      }
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        launch();
      }
    });

    btn.addEventListener('click', launch);

    // Suggestion links
    var links = document.querySelectorAll('[data-sub]');
    for (var i = 0; i < links.length; i++) {
      links[i].addEventListener('click', function (e) {
        e.preventDefault();
        var sub = this.getAttribute('data-sub');
        input.value = sub;
        input.focus();
      });
    }

    // Autofocus on desktop only
    if (window.matchMedia('(min-width: 640px)').matches) {
      setTimeout(function () { input.focus(); }, 100);
    }
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot() {
    var host = window.location.hostname;
    var sub = detectSubdomain(host);

    // www → redirect to apex
    if (sub === 'www') {
      window.location.replace(
        window.location.protocol + '//' + ROOT_DOMAIN + window.location.pathname + window.location.search
      );
      return;
    }

    // On subdomain (non-null, non-www)
    if (sub) {
      if (!isValidSubdomain(sub)) {
        document.getElementById('app').innerHTML = renderInvalidSubdomain(sub);
        return;
      }
      document.getElementById('app').innerHTML = renderSubdomainView(sub);
      // Update document title to reflect subdomain
      document.title = sub + ' — ' + ROOT_DOMAIN;
      return;
    }

    // On apex or unknown host (vercel.app, localhost, etc.)
    document.getElementById('app').innerHTML = renderLanding();
    // Bind landing interactions
    if (host === ROOT_DOMAIN || host === 'localhost' || host.indexOf('.vercel.app') !== -1 || !host) {
      mountLanding();
    } else {
      // Unknown host — still render landing but with interactions bound
      mountLanding();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
